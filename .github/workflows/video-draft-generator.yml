name: Crear borrador de vídeo original — Mundo al Día

on:
  push:
    paths:
      - "scripts/create_video_draft.py"
      - ".github/workflows/video-draft-generator.yml"
  pull_request:
    paths:
      - "scripts/create_video_draft.py"
      - ".github/workflows/video-draft-generator.yml"
  workflow_dispatch:
    inputs:
      title:
        description: "Titular revisado por una persona"
        required: true
        type: string
      summary:
        description: "Resumen verificado (60–1200 caracteres)"
        required: true
        type: string
      narration:
        description: "Narración en español ya revisada (100–2600 caracteres)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-draft:
    # En ramas de trabajo se crea un borrador de prueba; en main solo se ejecuta manualmente.
    if: github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar herramientas locales de creación
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: Crear vídeo original en español
        env:
          STORY_TITLE: ${{ inputs.title || 'Prueba técnica: cómo verificar una noticia' }}
          STORY_SUMMARY: ${{ inputs.summary || 'Esta es una prueba técnica del generador de vídeo. No representa una noticia real ni contiene afirmaciones de actualidad. Sirve únicamente para comprobar que el sistema produce gráficos originales y una narración en español.' }}
          STORY_NARRATION: ${{ inputs.narration || 'Esta es una prueba técnica de Mundo al Día. El sistema crea gráficos originales y una voz sintética en español a partir de un texto de ejemplo. Este contenido no es una noticia real y no debe publicarse como información de actualidad. La publicación automática permanece desactivada.' }}
        run: |
          python scripts/create_video_draft.py \
            --title "$STORY_TITLE" \
            --summary "$STORY_SUMMARY" \
            --narration "$STORY_NARRATION"

      - name: Comprobar el archivo MP4
        run: |
          test -s video-draft-output/mundo-al-dia-video-original.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 video-draft-output/mundo-al-dia-video-original.mp4

      - name: Guardar borrador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mundo-al-dia-video-original-draft
          path: video-draft-output/
          if-no-files-found: error
          retention-days: 7
