name: Crear borradores de vídeo — Mundo al Día

on:
  schedule:
    # GitHub usa UTC. Se cubren los dos cambios de horario de Nueva York.
    - cron: "0 14,15,23,0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mundo-al-dia-auto-video
  cancel-in-progress: false

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar horario local de Nueva York
        id: schedule
        run: |
          hour="$(TZ=America/New_York date +%H)"
          if [ "$hour" = "10" ] || [ "$hour" = "19" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Horario válido: $(TZ=America/New_York date)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Ejecución omitida: fuera de las 10:00 y 19:00 de Nueva York."
          fi

      - name: Descargar el código probado
        if: ${{ github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: fix/site-only-video-reliability

      - name: Instalar dependencias de vídeo
        if: ${{ github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install --upgrade pillow edge-tts CairoSVG
          python -c "import cairosvg; print('CairoSVG instalado:', cairosvg.__version__)"

      - name: Leer únicamente la última noticia de Mundo al Día y crear vídeo
        if: ${{ github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true' }}
        env:
          MUNDO_AL_DIA_SITE_URL: https://mundo-al-dia-github-production.up.railway.app
        run: python scripts/create_video_from_latest_news.py

      - name: Convertir MP4 para iPhone y Safari
        if: ${{ github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          input="video-draft-output/mundo-al-dia-video-original.mp4"
          output="video-draft-output/mundo-al-dia-video-compatible.mp4"
          test -s "$input"
          ffmpeg -y -i "$input" \
            -c:v libx264 -profile:v baseline -level 4.0 -pix_fmt yuv420p \
            -r 30 -crf 23 -preset medium \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -movflags +faststart "$output"
          test -s "$output"
          mv "$output" "$input"

      - name: Verificar MP4, narración y foto fuente
        if: ${{ github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          video = Path("video-draft-output/mundo-al-dia-video-original.mp4")
          audio = Path("video-draft-output/narracion_es.mp3")
          metadata = Path("video-draft-output/video-metadata.json")
          photo = Path("video-draft-output/FUENTE_Y_LICENCIA_FOTO.txt")
          assert video.is_file() and video.stat().st_size > 10000, "Falta el MP4."
          assert audio.is_file() and audio.stat().st_size > 1000, "Falta la narración."
          assert metadata.is_file() and photo.is_file(), "Faltan metadatos o referencia de la foto."
          data = json.loads(metadata.read_text(encoding="utf-8"))
          assert data.get("primary_article_image") or data.get("image_policy"), "No consta la política de foto única."
          info = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", str(video)
          ], text=True))
          vs = [s for s in info["streams"] if s.get("codec_type") == "video"]
          aus = [s for s in info["streams"] if s.get("codec_type") == "audio"]
          assert vs and aus, "Faltan pistas de vídeo o audio."
          assert (vs[0].get("width"), vs[0].get("height")) == (1080, 1920), "Resolución incorrecta."
          assert vs[0].get("codec_name") == "h264" and vs[0].get("pix_fmt") == "yuv420p", "Códec de vídeo incompatible."
          assert aus[0].get("codec_name") == "aac", "Códec de audio incompatible."
          print("MP4 verificado:", round(float(info["format"]["duration"]), 1), "segundos.")
          print("Modo borrador: no se carga a Cloudinary ni se publica en Facebook o Instagram.")
          PY

      - name: Guardar borrador como artefacto
        if: ${{ github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: mundo-al-dia-video-automatico
          path: video-draft-output/
          if-no-files-found: error
          retention-days: 7
