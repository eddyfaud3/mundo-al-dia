name: Video news workflow — DRY RUN (no publicar)

on:
  push:
    paths:
      - ".github/workflows/video-news-dry-run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verificar enlaces, páginas, fechas y corroboración independiente (solo informe)
        uses: actions/github-script@v7
        with:
          script: |
            const feeds = [
              { name: "DW Español", url: "https://rss.dw.com/rdf/rss-sp-all" },
              { name: "BBC Mundo", url: "https://feeds.bbci.co.uk/mundo/rss.xml" },
              { name: "France 24 Español", url: "https://www.france24.com/es/rss" }
            ];
            const headers = {
              "user-agent": "MundoAlDia-DryRun/2.0 (editorial verification test)",
              "accept": "application/rss+xml, application/atom+xml, application/xml, text/xml, text/html;q=0.9, */*;q=0.8"
            };
            const decode = s => String(s || "").replace(/<!\[CDATA\[|\]\]>/g, "").replace(/&amp;/g, "&").replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n)));
            const textOf = s => decode(String(s || "").replace(/<script\b[\s\S]*?<\/script>/gi, " ").replace(/<style\b[\s\S]*?<\/style>/gi, " ").replace(/<[^>]+>/g, " ")).replace(/\s+/g, " ").trim();
            const attr = (s, name) => {
              const re = new RegExp("\\b" + name + "\\s*=\\s*(['\"])(.*?)\\1", "i");
              const m = String(s || "").match(re);
              return m ? decode(m[2]) : "";
            };
            const tag = (s, name) => {
              const re = new RegExp("<(?:[\\w.-]+:)?" + name + "\\b[^>]*>([\\s\\S]*?)<\\/(?:[\\w.-]+:)?" + name + "\\s*>", "i");
              const m = String(s || "").match(re);
              return m ? textOf(m[1]) : "";
            };
            const absolute = (raw, base) => { try { return new URL(raw, base).href; } catch { return ""; } };
            const isVideoUrl = raw => {
              try {
                const u = new URL(raw);
                const h = u.hostname.toLowerCase();
                const p = u.pathname;
                const q = u.searchParams;
                // A channel, profile, playlist, or publisher home page is NOT a specific video.
                if (h === "youtu.be") return /^\/[A-Za-z0-9_-]{6,}$/.test(p);
                if (h === "youtube.com" || h.endsWith(".youtube.com")) {
                  if (p === "/watch") return /^[A-Za-z0-9_-]{6,}$/.test(q.get("v") || "");
                  return /^\/(?:shorts|embed|live)\/[A-Za-z0-9_-]{6,}/i.test(p);
                }
                if (h === "vimeo.com" || h.endsWith(".vimeo.com")) {
                  return /^\/(?:video\/)?\d{6,}(?:\/|$)/i.test(p) && !/^\/(?:channels|groups|showcase|user|album)\//i.test(p);
                }
                if (h === "dailymotion.com" || h.endsWith(".dailymotion.com")) {
                  return /^\/(?:video|embed\/video)\/[A-Za-z0-9]+/i.test(p);
                }
                return /\.(mp4|m3u8|webm|mov)$/i.test(p);
              } catch { return false; }
            };
            // Algunos medios usan un reproductor alojado en su propio dominio, no una URL de YouTube/MP4.
            // Solo aceptamos rutas que identifiquen explícitamente un player, embed o vídeo.
            const isFirstPartyPlayerUrl = raw => {
              try {
                const u = new URL(raw);
                const h = u.hostname.toLowerCase();
                const trustedPublisher = h === "dw.com" || h.endsWith(".dw.com") ||
                  h === "bbc.com" || h.endsWith(".bbc.com") || h === "bbc.co.uk" || h.endsWith(".bbc.co.uk") ||
                  h === "france24.com" || h.endsWith(".france24.com");
                const path = decodeURIComponent(u.pathname).toLowerCase();
                if (!trustedPublisher) return false;
                // A broad /video/ link is not enough: require a specific content/player route.
                if (h.endsWith("france24.com")) return /^\/es\/video\/\d{8}-[^/]+$/.test(path);
                if (h.endsWith("dw.com")) return /^\/es\/[^/]+\/video-\d+\.html$/.test(path) || /\/(embed|player|av-embed|media-player|playback)\//i.test(path);
                return /\/(embed|player|av-embed|media-player|playback)\//i.test(path) || /^\/[^/]+\/video\/[^/]+$/i.test(path);
              } catch { return false; }
            };
            const isRelevantVideoUrl = (raw, story) => {
              try {
                const u = new URL(raw);
                if (isVideoUrl(raw)) return true;
                if (!isFirstPartyPlayerUrl(raw)) return false;
                const article = new URL(story.url);
                const p = decodeURIComponent(u.pathname).toLowerCase();
                const a = decodeURIComponent(article.pathname).toLowerCase();
                // First-party player must be the story itself or have a strong title overlap.
                if (u.hostname === article.hostname && (u.pathname === article.pathname || p.startsWith(a + "/"))) return true;
                const titleWords = new Set(cleanTokens(story.title));
                const pathWords = new Set(cleanTokens(p.replace(/\//g, " ")));
                const overlap = [...titleWords].filter(w => pathWords.has(w)).length;
                return overlap >= 3;
              } catch { return false; }
            };
            const stopWords = new Set(["para","como","desde","sobre","entre","tras","esta","este","estos","estas","unos","unas","donde","cuando","porque","tambien","segun","despues","durante","hasta","contra","ante","their","there","about","after","before","from","with","that","this","have","will","what","were","been","says","said","into","over","more","than","near","world","mundo","ultima","hora","video","vdeo"]);
            const cleanTokens = s => textOf(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(w => w.length >= 4 && !stopWords.has(w));
            const similarity = (a,b) => {
              const aa = new Set(cleanTokens(a)), bb = new Set(cleanTokens(b));
              const common = [...aa].filter(w => bb.has(w));
              const ratio = common.length / Math.max(1, Math.min(aa.size, bb.size));
              return { common, ratio, match: common.length >= 3 && ratio >= 0.55 };
            };
            const fetchText = async (url, ms = 8000) => {
              const res = await fetch(url, { headers, signal: AbortSignal.timeout(ms), redirect: "follow" });
              if (!res.ok) throw new Error("HTTP " + res.status);
              return await res.text();
            };
            // Diagnóstico de página: conserva código HTTP, URL final y tipo de contenido.
            const fetchPage = async (url, ms = 7000) => {
              const res = await fetch(url, { headers, signal: AbortSignal.timeout(ms), redirect: "follow" });
              const html = await res.text();
              return { html, status: res.status, finalUrl: res.url, contentType: res.headers.get("content-type") || "" };
            };
            const getLink = block => {
              const linkTag = block.match(/<(?:[\w.-]+:)?link\b[^>]*>/i);
              if (linkTag) {
                const href = attr(linkTag[0], "href");
                const rel = attr(linkTag[0], "rel");
                if (href && (!rel || rel === "alternate")) return href;
              }
              return tag(block, "link");
            };
            const allIndex = [];
            const inspectQueue = [];
            const sourceResults = [];
            for (const feed of feeds) {
              try {
                const xml = await fetchText(feed.url, 12000);
                const blocks = [...xml.matchAll(/<(?:[\w.-]+:)?(?:item|entry)\b[^>]*>[\s\S]*?<\/(?:[\w.-]+:)?(?:item|entry)\s*>/gi)].map(m => m[0]);
                const parsed = blocks.map(block => {
                  const titleMatch = block.match(/<(?:[\w.-]+:)?title\b[^>]*>([\s\S]*?)<\/(?:[\w.-]+:)?title\s*>/i);
                  const title = titleMatch ? textOf(decode(titleMatch[1]).replace(/^<!\[CDATA\[|\]\]>$/g, "")) : (tag(block, "title") || "(sin título)");
                  const link = absolute(getLink(block), feed.url);
                  const published = tag(block, "pubDate") || tag(block, "published") || tag(block, "updated") || tag(block, "date");
                  const dateMs = published ? Date.parse(published) : NaN;
                  const rssVideos = [];
                  for (const m of block.matchAll(/<(?:[\w.-]+:)?(?:content|player|enclosure)\b[^>]*>/gi)) {
                    const el = m[0];
                    const raw = attr(el, "url") || attr(el, "href");
                    const type = attr(el, "type") + " " + attr(el, "medium");
                    const u = absolute(raw, feed.url);
                    if (u && (isVideoUrl(u) || /video/i.test(type))) rssVideos.push({url:u, evidence:"adjunto multimedia RSS/Atom"});
                  }
                  return { source:feed.name, feedUrl:feed.url, title, url:link, published, dateMs, rssVideos, pageChecked:false, pageStatus:"sin inspeccionar página", videos:[], pageTitle:"", pageText:"", reason:"" };
                });
                allIndex.push(...parsed);
                inspectQueue.push(...parsed.filter(s => s.url && /^https?:/i.test(s.url)).slice(0, 8));
                sourceResults.push({ name:feed.name, url:feed.url, ok:true, count:blocks.length, indexed:parsed.length, inspected:0, embeds:0 });
                core.info("RSS OK " + feed.name + ": " + blocks.length + " entradas; se inspeccionarán hasta 8 páginas.");
              } catch (e) {
                sourceResults.push({ name:feed.name, url:feed.url, ok:false, count:0, indexed:0, inspected:0, embeds:0, error:e.message });
                core.warning("Falló la fuente " + feed.name + ": " + e.message);
              }
            }
            for (const story of inspectQueue) {
              try {
                const page = await fetchPage(story.url, 7000);
                const html = page.html;
                story.httpStatus = page.status;
                story.finalUrl = page.finalUrl;
                story.contentType = page.contentType;
                story.pageChecked = page.status >= 200 && page.status < 400 && /html|xml/i.test(page.contentType);
                story.pageStatus = "HTTP " + page.status + "; " + (page.contentType || "tipo desconocido") + "; URL final: " + page.finalUrl;
                if (!story.pageChecked) story.reason = "La respuesta no parece una página HTML/XML accesible para inspección.";
                const titleTag = html.match(/<title\b[^>]*>([\s\S]*?)<\/title>/i);
                story.pageTitle = titleTag ? textOf(titleTag[1]) : "";
                const evidence = [];
                const addVideo = (raw, why, allowPublisherPlayer = false) => {
                  const u = absolute(raw, story.url);
                  if (u && (isVideoUrl(u) || (allowPublisherPlayer && isRelevantVideoUrl(u, story)))) evidence.push({url:u, evidence:why});
                };
                for (const m of html.matchAll(/<(iframe|video|source|embed)\b[^>]*>/gi)) {
                  const el = m[0];
                  const raw = attr(el,"src") || attr(el,"data-src") || attr(el,"data-video-url") || attr(el,"data-embed-url") || attr(el,"data-player-url");
                  addVideo(raw, "<" + m[1].toLowerCase() + "> dentro de la página", /iframe|embed/i.test(m[1]));
                }
                // Busca URLs de reproductor en atributos de carga diferida y enlaces de la página.
                for (const m of html.matchAll(/<[a-z][\w:-]*\b[^>]*>/gi)) {
                  const el = m[0];
                  for (const key of ["data-src","data-href","data-url","data-video-url","data-embed-url","data-player-url","data-player","data-media-url"]) {
                    const raw = attr(el,key);
                    if (raw) addVideo(raw, "atributo " + key, true);
                  }
                }
                for (const m of html.matchAll(/<a\b[^>]*>/gi)) {
                  const raw = attr(m[0],"href");
                  const u = absolute(raw, story.url);
                  if (u && isRelevantVideoUrl(u, story)) evidence.push({url:u,evidence:"enlace específico a vídeo del mismo medio; relevancia por ruta/titular"});
                }
                for (const m of html.matchAll(/<meta\b[^>]*>/gi)) {
                  const el = m[0];
                  const key = (attr(el,"property") + " " + attr(el,"name") + " " + attr(el,"itemprop")).toLowerCase();
                  if (/video|content_url|embedurl/.test(key)) addVideo(attr(el,"content"), "metadato de vídeo: " + key.trim(), true);
                }
                for (const m of html.matchAll(/<script\b[^>]*type\s*=\s*(['"])application\/ld\+json\1[^>]*>([\s\S]*?)<\/script>/gi)) {
                  const jsonText = decode(m[2]);
                  if (/VideoObject/i.test(jsonText)) {
                    const urls = jsonText.match(/https?:\\?\/\\?\/[^"'\\\s]+/g) || [];
                    for (const raw of urls) addVideo(raw.replace(/\\\//g,"/"), "JSON-LD VideoObject", true);
                  }
                }
                story.videos = [...new Map([...evidence, ...story.rssVideos].map(v => [v.url,v])).values()].slice(0,8);
                story.pageText = textOf(html).slice(0,12000);
                if (story.videos.length) story.pageStatus = "vídeo detectado en reproductor/metadatos";
                else if (/\b(video|vídeo|reproductor|player|youtube|vimeo)\b/i.test(html)) story.pageStatus = "señal de vídeo, enlace del reproductor no confirmado";
                else story.pageStatus = "no se detectó reproductor de vídeo específico";
              } catch (e) {
                story.pageStatus = "error al abrir página: " + e.message;
                story.reason = e.message;
              }
            }
            for (const s of sourceResults) {
              s.inspected = inspectQueue.filter(x => x.source === s.name && x.pageChecked).length;
              s.embeds = inspectQueue.filter(x => x.source === s.name && x.videos.length > 0).length;
            }
            const now = Date.now();
            const isRecent = s => Number.isFinite(s.dateMs) && s.dateMs <= now + 3*3600000 && s.dateMs >= now - 72*3600000;
            const decision = [];
            for (const story of inspectQueue) {
              const dateOk = isRecent(story);
              const actualVideo = story.videos.length > 0;
              const peers = allIndex.filter(other => other.source !== story.source && other.url && isRecent(other) && Number.isFinite(other.dateMs) && Math.abs(other.dateMs-story.dateMs) <= 48*3600000 && similarity(story.title, other.title).match);
              const peerEvidence = peers.map(p => ({source:p.source,title:p.title,url:p.url,published:p.published}));
              const eventWords = [...new Set(cleanTokens(story.title))];
              const pageTitleTokens = new Set(cleanTokens(story.pageTitle));
              const pageTitleOverlap = eventWords.filter(w => pageTitleTokens.has(w)).length;
              const pageTitleMatches = pageTitleOverlap >= 2;
              let status, reason;
              if (!story.pageChecked) {
                status = "RECHAZADO";
                reason = "No se pudo abrir la página del artículo; no se puede verificar el contexto ni el reproductor.";
              } else if (!dateOk) {
                status = "RECHAZADO";
                reason = "Fecha ausente, inválida, demasiado antigua o demasiado futura para esta prueba (ventana: últimas 72 h; tolerancia futura: 3 h).";
              } else if (!actualVideo) {
                status = "RECHAZADO";
                reason = "No se encontró un enlace específico en iframe/video/source o metadatos de vídeo; una palabra o enlace genérico no basta.";
              } else if (peers.length > 0 && pageTitleMatches) {
                status = "CONFIRMADO (preliminar)";
                reason = "Página abierta + reproductor/metadatos de vídeo detectados + título de página coherente + al menos una noticia independiente con palabras clave de evento compartidas y fecha a menos de 48 h. Requiere revisión humana de hechos.";
              } else {
                status = "NECESITA VERIFICACIÓN";
                reason = !pageTitleMatches ? "El título de la página no coincide suficientemente con el titular RSS; revisar redirecciones o página incorrecta." : "Hay un posible vídeo, pero no se encontró una noticia independiente que coincida en evento y fecha dentro del índice RSS consultado.";
              }
              decision.push({...story,status,reason,peerEvidence});
            }
            const confirmed = decision.filter(s => s.status === "CONFIRMADO (preliminar)");
            const review = decision.filter(s => s.status === "NECESITA VERIFICACIÓN");
            const rejected = decision.filter(s => s.status === "RECHAZADO");
            core.summary.addHeading("Mundo al Día — verificación de vídeos (DRY RUN)");
            core.summary.addRaw("MODO SOLO PRUEBA: no publica en el sitio, Railway, Facebook ni Instagram; no descarga ni vuelve a subir vídeos. “Confirmado (preliminar)” significa que pasan filtros automáticos de enlace, página, fecha y coincidencia independiente por título/evento; NO equivale a una verificación periodística completa ni confirma derechos de reutilización. Revisión humana obligatoria antes de cualquier uso.\n\n");
            core.summary.addHeading("Estado de las fuentes",2);
            core.summary.addTable([
              [{data:"Fuente",header:true},{data:"Estado",header:true},{data:"Entradas RSS",header:true},{data:"Páginas abiertas",header:true},{data:"Páginas con reproductor/metadatos",header:true}],
              ...sourceResults.map(s => [s.name,s.ok?"OK":"ERROR",String(s.count),String(s.inspected),String(s.embeds)])
            ]);
            const renderTable = (items, title) => {
              core.summary.addHeading(title,2);
              if (!items.length) { core.summary.addRaw("No hay resultados en esta categoría.\n\n"); return; }
              core.summary.addTable([
                [{data:"Titular RSS",header:true},{data:"Fuente principal",header:true},{data:"Fecha RSS",header:true},{data:"Estado de página/título",header:true},{data:"Enlace del artículo",header:true},{data:"Vídeo y evidencia",header:true},{data:"Fuente independiente / motivo",header:true}],
                ...items.slice(0,25).map(s => [
                  s.title,
                  s.source,
                  s.published || "fecha ausente",
                  (s.pageStatus || "") + (s.pageTitle ? " | título página: " + s.pageTitle.slice(0,180) : "") + (s.httpStatus ? " | HTTP " + s.httpStatus : "") + (s.finalUrl ? " | final " + s.finalUrl : ""),
                  s.url || "sin URL",
                  s.videos.length ? s.videos.map(v => v.url + " (" + v.evidence + ")").join(" ; ") : "ningún enlace específico confirmado",
                  (s.peerEvidence.length ? s.peerEvidence.map(p => p.source + ": " + p.title + " [" + p.url + "]").join(" ; ") : "") + (s.peerEvidence.length ? " | " : "") + s.reason
                ])
              ]);
            };
            renderTable(confirmed,"1. CONFIRMADOS PRELIMINARMENTE — revisión humana obligatoria");
            renderTable(review,"2. NECESITAN VERIFICACIÓN");
            renderTable(rejected,"3. RECHAZADOS POR LOS FILTROS DE ESTA PRUEBA");
            core.summary.addRaw("\nCobertura: se indexan las entradas RSS devueltas por las fuentes, pero solo se abren como máximo 8 páginas por fuente en este ensayo. La corroboración independiente se busca en los titulares y fechas RSS de las otras fuentes disponibles; la comparación automática puede pasar por alto una noticia redactada de forma diferente o confundir coincidencias. “Rechazado” significa que el candidato no superó los filtros de esta prueba, no que la noticia sea falsa. Ninguna decisión autoriza publicación automática.\n");
            await core.summary.write();
            core.info("Dry run completado: " + decision.length + " páginas inspeccionadas; " + confirmed.length + " confirmadas preliminarmente; " + review.length + " necesitan verificación; " + rejected.length + " rechazadas por filtros. No se publicó contenido.");
            if (sourceResults.every(s => !s.ok)) core.setFailed("Ninguna fuente RSS respondió correctamente.");
