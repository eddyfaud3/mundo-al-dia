name: Crear borrador de vídeo original — Mundo al Día

on:
  push:
    paths:
      - "scripts/create_video_draft.py"
      - ".github/workflows/video-draft-generator.yml"
  pull_request:
    paths:
      - "scripts/create_video_draft.py"
      - ".github/workflows/video-draft-generator.yml"
  workflow_dispatch:
    inputs:
      title:
        description: "Titular revisado por una persona"
        required: true
        type: string
      summary:
        description: "Resumen verificado (60–1200 caracteres)"
        required: true
        type: string
      narration:
        description: "Narración en español ya revisada (100–2600 caracteres)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-draft:
    # En ramas de trabajo se crea un borrador de prueba; en main solo se ejecuta manualmente.
    if: github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar herramientas locales de creación
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install pillow edge-tts

      - name: Crear vídeo original en español
        env:
          STORY_TITLE: "${{ inputs.title || 'EE. UU. e Irán siguen sin acuerdo y aumenta la tensión en el estrecho de Ormuz' }}"
          STORY_SUMMARY: "${{ inputs.summary || 'Los contactos entre Estados Unidos e Irán continúan estancados, mientras crece la preocupación por la seguridad marítima en el estrecho de Ormuz. Reuters informó el 21 de octubre de que los precios del petróleo subieron ante el temor a interrupciones del suministro en Oriente Medio. La situación sigue siendo cambiante y no existe un acuerdo definitivo.' }}"
          STORY_NARRATION: "${{ inputs.narration || 'Las tensiones entre Estados Unidos e Irán continúan y las negociaciones siguen sin alcanzar un acuerdo definitivo. Según Reuters, funcionarios iraníes consideran que las conversaciones permanecen estancadas, mientras la región sigue en alerta. Este miércoles, los precios del petróleo subieron ante el temor a interrupciones del suministro en Oriente Medio y riesgos para el transporte marítimo. El estrecho de Ormuz es una ruta clave para el comercio energético mundial. Por ahora, no hay una solución duradera confirmada. Seguiremos atentos a los anuncios oficiales y a la evolución de las negociaciones. Sigue a Mundo al Día para conocer las últimas noticias internacionales.' }}"
        run: |
          python scripts/create_video_draft.py \
            --title "$STORY_TITLE" \
            --summary "$STORY_SUMMARY" \
            --narration "$STORY_NARRATION"

      - name: Convertir MP4 a formato compatible con iPhone y Safari
        run: |
          set -euo pipefail
          input="video-draft-output/mundo-al-dia-video-original.mp4"
          output="video-draft-output/mundo-al-dia-video-compatible.mp4"
          test -s "$input"
          ffmpeg -y -i "$input" \
            -c:v libx264 -profile:v baseline -level 4.0 -pix_fmt yuv420p \
            -r 30 -crf 23 -preset medium \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -movflags +faststart "$output"
          test -s "$output"
          # Mantener el nombre original como archivo principal del artefacto.
          mv "$output" "$input"

      - name: Verificación final de vídeo y audio
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          video = Path("video-draft-output/mundo-al-dia-video-original.mp4")
          audio = Path("video-draft-output/narracion_es.mp3")
          assert video.is_file() and video.stat().st_size > 10000, "Falta el MP4 o es demasiado pequeño."
          assert audio.is_file() and audio.stat().st_size > 1000, "Falta el audio de narración."

          raw = subprocess.check_output([
              "ffprobe", "-v", "error", "-show_streams", "-show_format",
              "-of", "json", str(video)
          ], text=True)
          info = json.loads(raw)
          streams = info.get("streams", [])
          video_streams = [s for s in streams if s.get("codec_type") == "video"]
          audio_streams = [s for s in streams if s.get("codec_type") == "audio"]
          assert video_streams, "El MP4 no contiene pista de vídeo."
          assert audio_streams, "El MP4 no contiene pista de audio."
          assert video_streams[0].get("width") == 1080, "El vídeo no tiene 1080 píxeles de ancho."
          assert video_streams[0].get("height") == 1920, "El vídeo no tiene 1920 píxeles de alto."
          assert video_streams[0].get("codec_name") == "h264", "El vídeo no usa H.264."
          assert video_streams[0].get("profile") == "Constrained Baseline", "El perfil de vídeo no es compatible con el objetivo iPhone."
          assert video_streams[0].get("pix_fmt") == "yuv420p", "Formato de píxel inesperado."
          assert audio_streams[0].get("codec_name") == "aac", "El audio no usa AAC."
          assert audio_streams[0].get("sample_rate") == "44100", "El audio no es de 44,1 kHz."
          assert int(audio_streams[0].get("channels", 0)) == 2, "El audio no es estéreo."
          duration = float(info["format"].get("duration", 0))
          assert duration >= 5, f"Duración inesperada: {duration:.1f} segundos."
          print(f"Verificación técnica OK: H.264 Baseline, yuv420p, AAC estéreo 44,1 kHz, 1080x1920, {duration:.1f} s.")
          print("PUBLICADO=NO — revisión editorial humana obligatoria.")
          PY

      - name: Guardar borrador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mundo-al-dia-video-original-draft
          path: video-draft-output/
          if-no-files-found: error
          retention-days: 7
