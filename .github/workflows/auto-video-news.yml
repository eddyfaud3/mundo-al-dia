name: Publicación automática de vídeos — Mundo al Día

on:
  schedule:
    # GitHub usa UTC; estas cuatro horas cubren EDT y EST. El filtro TZ elige solo 10:00 y 19:00 de Nueva York.
    - cron: "0 14,15,23,0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mundo-al-dia-auto-video-publicacion
  cancel-in-progress: false

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validar el horario programado de Nueva York
        id: schedule
        run: |
          set -euo pipefail
          local_hour="$(TZ=America/New_York date +%H)"
          local_time="$(TZ=America/New_York date +%Y-%m-%dT%H:%M:%S%z)"
          run=false
          if [ "$local_hour" = "10" ] || [ "$local_hour" = "19" ]; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Hora local de Nueva York: $local_time; ejecutar: $run"
          if [ "$run" != "true" ]; then
            echo "Esta ejecución UTC no corresponde a las 10:00 ni a las 19:00 de Nueva York; se omite."
          fi

      - name: Descargar el código probado
        if: ${{ github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: fix/site-only-video-reliability

      - name: Instalar dependencias de vídeo
        if: ${{ github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install --upgrade pillow edge-tts CairoSVG
          python -c "import cairosvg; print('CairoSVG instalado:', cairosvg.__version__)"

      - name: Leer únicamente la última noticia de Mundo al Día y crear vídeo
        if: ${{ github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true' }}
        env:
          MUNDO_AL_DIA_SITE_URL: https://mundo-al-dia-github-production.up.railway.app
        run: python scripts/create_video_from_latest_news.py

      - name: Convertir MP4 para iPhone y Safari
        if: ${{ github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          input="video-draft-output/mundo-al-dia-video-original.mp4"
          output="video-draft-output/mundo-al-dia-video-compatible.mp4"
          test -s "$input"
          ffmpeg -y -i "$input" \
            -c:v libx264 -profile:v baseline -level 4.0 -pix_fmt yuv420p \
            -r 30 -crf 23 -preset medium \
            -c:a aac -b:a 128k -ar 44100 -ac 2 \
            -movflags +faststart "$output"
          test -s "$output"
          mv "$output" "$input"

      - name: Verificar MP4, narración y foto fuente
        if: ${{ github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          video = Path("video-draft-output/mundo-al-dia-video-original.mp4")
          audio = Path("video-draft-output/narracion_es.mp3")
          metadata = Path("video-draft-output/video-metadata.json")
          photo = Path("video-draft-output/FUENTE_Y_LICENCIA_FOTO.txt")
          assert video.is_file() and video.stat().st_size > 10000, "Falta el MP4."
          assert audio.is_file() and audio.stat().st_size > 1000, "Falta la narración."
          assert metadata.is_file() and photo.is_file(), "Faltan metadatos o referencia de la foto."
          data = json.loads(metadata.read_text(encoding="utf-8"))
          assert data.get("primary_article_image") or data.get("image_policy"), "No consta la política de foto única."
          info = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", str(video)
          ], text=True))
          vs = [s for s in info["streams"] if s.get("codec_type") == "video"]
          aus = [s for s in info["streams"] if s.get("codec_type") == "audio"]
          assert vs and aus, "Faltan pistas de vídeo o audio."
          assert (vs[0].get("width"), vs[0].get("height")) == (1080, 1920), "Resolución incorrecta."
          assert vs[0].get("codec_name") == "h264" and vs[0].get("pix_fmt") == "yuv420p", "Códec de vídeo incompatible."
          assert aus[0].get("codec_name") == "aac", "Códec de audio incompatible."
          print("MP4 verificado:", round(float(info["format"]["duration"]), 1), "segundos.")
          print("MP4 verificado y listo para publicación.")
          PY

      - name: Subir MP4 a Cloudinary
        if: ${{ github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true' }}
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: |
          set -euo pipefail
          test -n "${CLOUDINARY_URL:-}" || { echo "::error::Falta CLOUDINARY_URL."; exit 1; }
          npm install --no-save cloudinary
          node --input-type=module <<'NODE'
          import { v2 as cloudinary } from "cloudinary";
          import { writeFile } from "node:fs/promises";
          const uploaded = await cloudinary.uploader.upload(
            "video-draft-output/mundo-al-dia-video-original.mp4",
            { resource_type: "video", folder: "mundo-al-dia/videos",
              public_id: `video-auto-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`,
              overwrite: false }
          );
          if (!uploaded.secure_url?.startsWith("https://")) throw new Error("Cloudinary no devolvió una URL HTTPS.");
          await writeFile("video-draft-output/public-video-url.txt", uploaded.secure_url + "\n");
          console.log("Vídeo almacenado en Cloudinary.");
          NODE

      - name: Publicar vídeo en el sitio, Facebook e Instagram
        if: ${{ github.event_name == 'workflow_dispatch' || steps.schedule.outputs.run == 'true' }}
        env:
          AUTOMATION_SECRET: ${{ secrets.MUNDO_AL_DIA_AUTOMATION_SECRET }}
          SITE_URL: https://mundo-al-dia-github-production.up.railway.app
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_SECRET:-}" || { echo "::error::Falta MUNDO_AL_DIA_AUTOMATION_SECRET."; exit 1; }
          export VIDEO_URL="$(cat video-draft-output/public-video-url.txt)"
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          with open("video-draft-output/video-metadata.json",encoding="utf-8") as f:
              m=json.load(f)
          payload={
              "video_url":os.environ["VIDEO_URL"],
              "title":m["title"],
              "caption":(m.get("caption") or m.get("summary") or m["title"])[:1200],
              "source_url":m["source_url"],
              "run_id":os.environ["RUN_ID"].replace("-","_")
          }
          req=urllib.request.Request(
              os.environ["SITE_URL"].rstrip("/")+"/api/automation/publish-video",
              data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),
              headers={"Authorization":"Bearer "+os.environ["AUTOMATION_SECRET"],
                       "Content-Type":"application/json"},
              method="POST")
          try:
              with urllib.request.urlopen(req,timeout=180) as response:
                  result=json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(e.read().decode("utf-8","replace"))
              raise
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if result.get("dry_run"):
              raise SystemExit("VIDEO_AUTO_PUBLISH_ENABLED está apagado; no se publicó.")
          if not result.get("site_published"):
              raise SystemExit("El sitio no confirmó la publicación.")
          if not result.get("facebook",{}).get("published"):
              raise SystemExit("Facebook no confirmó la publicación; revisar antes de reintentar.")
          if not result.get("instagram",{}).get("published"):
              raise SystemExit("Instagram no confirmó la publicación; revisar antes de reintentar.")
          print("CONFIRMADO: vídeo publicado en sitio, Facebook e Instagram.")
          PY

      - name: Guardar vídeo y comprobantes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mundo-al-dia-video-automatico
          path: video-draft-output/
          if-no-files-found: warn
          retention-days: 7
