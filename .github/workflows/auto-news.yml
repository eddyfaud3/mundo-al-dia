name: Publicación automática de noticias internacionales

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mundo-al-dia-auto-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Buscar una noticia reciente en español y publicarla
        uses: actions/github-script@v7
        env:
          AUTOMATION_SECRET: ${{ secrets.MUNDO_AL_DIA_AUTOMATION_SECRET }}
          SITE_URL: https://mundo-al-dia-github-production.up.railway.app
        with:
          script: |
            if (!process.env.AUTOMATION_SECRET) {
              core.setFailed("Falta el secreto MUNDO_AL_DIA_AUTOMATION_SECRET en GitHub Actions.");
              return;
            }

            const feedUrl = "https://news.google.com/rss/search?q=noticias+internacionales+OR+emergencia+OR+inundaciones+OR+terremoto+when:2h&hl=es-419&gl=US&ceid=US:es-419";
            const feedResponse = await fetch(feedUrl, {
              headers: { "User-Agent": "MundoAlDiaNewsBot/1.0 (editorial news monitoring)" }
            });
            if (!feedResponse.ok) {
              core.setFailed(`No se pudo consultar el feed de noticias (HTTP ${feedResponse.status}).`);
              return;
            }
            const xml = await feedResponse.text();
            const decode = (s) => s
              .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, "$1")
              .replace(/&amp;/g, "&").replace(/&quot;/g, '"')
              .replace(/&#39;|&apos;/g, "'").replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">").replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n)))
              .replace(/&#x([0-9a-f]+);/gi, (_, n) => String.fromCodePoint(parseInt(n, 16)));
            const tag = (block, name) => {
              const match = block.match(new RegExp("<" + name + "(?:\\s[^>]*)?>([\\s\\S]*?)</" + name + ">", "i"));
              return match ? decode(match[1]).trim() : "";
            };
            const clean = (s) => decode(s.replace(/<script[\s\S]*?<\/script>/gi, " ").replace(/<[^>]+>/g, " "))
              .replace(/\s+/g, " ").trim();
            const items = [...xml.matchAll(/<item\b[^>]*>([\s\S]*?)<\/item>/gi)].map(m => {
              const block = m[1];
              const rawTitle = clean(tag(block, "title"));
              const link = tag(block, "link");
              const description = clean(tag(block, "description"));
              const pubDate = tag(block, "pubDate");
              const title = rawTitle.replace(/\s+-\s+[^-]+$/, "").trim();
              const sourceMatch = rawTitle.match(/\s+-\s+([^-]+)$/);
              const source = sourceMatch ? sourceMatch[1].trim() : "Google News";
              const date = pubDate ? new Date(pubDate) : new Date();
              return { title, link, description, source, date };
            }).filter(x =>
              x.title.length >= 18 &&
              x.description.length >= 70 &&
              /^https:\/\//i.test(x.link) &&
              !Number.isNaN(x.date.getTime()) &&
              Date.now() - x.date.getTime() < 6 * 60 * 60 * 1000
            );

            if (!items.length) {
              core.warning("No se encontró una noticia reciente con suficiente contexto; no se publicó nada.");
              return;
            }

            async function findArticleImage(url) {
              try {
                const response = await fetch(url, {
                  headers: { "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" },
                  redirect: "follow",
                  signal: AbortSignal.timeout(10000)
                });
                if (!response.ok) return "";
                const html = (await response.text()).slice(0, 2000000);
                const baseUrl = response.url || url;
                const candidates = [];
                const metas = html.match(/<meta\\b[^>]*>/gi) || [];
                for (const meta of metas) {
                  const key = meta.match(/(?:property|name)\\s*=\\s*["'](og:image|og:image:url|twitter:image|twitter:image:src)["']/i)?.[1];
                  if (!key) continue;
                  const raw = meta.match(/content\\s*=\\s*["']([^"']+)["']/i)?.[1];
                  if (raw) candidates.push(raw);
                }
                const images = html.match(/<img\\b[^>]*>/gi) || [];
                for (const tag of images.slice(0, 80)) {
                  const raw = tag.match(/(?:src|data-src|data-original)\\s*=\\s*["']([^"']+)["']/i)?.[1];
                  const alt = tag.match(/alt\\s*=\\s*["']([^"']*)["']/i)?.[1] || "";
                  if (raw && !/(logo|favicon|avatar|sprite|placeholder|icon)/i.test(alt + " " + raw)) candidates.push(raw);
                }
                for (const raw of candidates) {
                  try {
                    const image = new URL(raw.replace(/&amp;/g, "&").trim(), baseUrl);
                    const host = image.hostname.toLowerCase();
                    const path = image.pathname.toLowerCase();
                    const isGoogleAsset =
                      host === "google.com" || host.endsWith(".google.com") ||
                      host === "googleusercontent.com" || host.endsWith(".googleusercontent.com") ||
                      host === "gstatic.com" || host.endsWith(".gstatic.com") ||
                      host === "googleapis.com" || host.endsWith(".googleapis.com");
                    const looksGeneric = /(?:^|[\\/_-])(logo|favicon|icon|avatar|sprite|placeholder|default)(?:[\\/_\\-.]|$)/i.test(path);
                    const imageFile = /\\.(jpe?g|png|webp)(?:$|[?#])/i.test(image.href);
                    if (image.protocol === "https:" && !isGoogleAsset && !looksGeneric && (imageFile || /image|photo|media|upload|content|article/i.test(path))) return image.href;
                  } catch {}
                }
              } catch (error) {
                core.info("No se pudo obtener la imagen de la fuente: " + (error?.message || "error de lectura"));
              }
              return "";
            }

            const slugify = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
              .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 150).replace(/-+$/g, "");
            let lastError = "";
            for (const item of items.slice(0, 8)) {
              const excerpt = item.description.slice(0, 700);
              const content = [
                item.description,
                "",
                "Esta nota ofrece un resumen breve basado en la información publicada por " + item.source + ". Los detalles pueden actualizarse a medida que se conozcan nuevos datos.",
                "",
                "Fuente original: " + item.source,
                item.link
              ].join("\n");
              const imageUrl = await findArticleImage(item.link);
              if (imageUrl) {
                core.info("Se encontró una imagen pública de la fuente.");
              } else {
                core.warning("No se encontró una imagen pública para esta noticia; se publicará el texto para no detener toda la automatización.");
              }

              const article = {
                title: item.title,
                slug: slugify(item.title),
                excerpt,
                content,
                category: "Internacional",
                image_url: imageUrl,
                video_url: ""
              };
              if (!article.slug) continue;

              const response = await fetch(new URL("/api/automation/publish", process.env.SITE_URL), {
                method: "POST",
                headers: {
                  "Authorization": "Bearer " + process.env.AUTOMATION_SECRET,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(article)
              });
              const result = await response.json().catch(() => ({}));
              if (response.status === 409) {
                core.info("La noticia ya existe; se prueba la siguiente noticia del feed.");
                continue;
              }
              if (!response.ok) {
                lastError = result.error || "HTTP " + response.status;
                core.warning("No se pudo publicar esta noticia: " + lastError);
                continue;
              }

              core.info("Noticia publicada en el sitio: " + result.url);
              if (result.facebook?.published) {
                core.info("Resumen publicado también en Facebook.");
              } else {
                core.warning("La noticia está en el sitio, pero Facebook no confirmó la publicación: " + (result.facebook?.reason || "sin detalles"));
              }
              return;
            }

            core.setFailed(lastError || "No se pudo publicar ninguna noticia nueva del feed.");
