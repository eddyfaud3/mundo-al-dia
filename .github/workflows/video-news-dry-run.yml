name: Video news workflow — DRY RUN (no publicar)

on:
  push:
    paths:
      - ".github/workflows/video-news-dry-run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar fuentes sin publicar
        uses: actions/github-script@v7
        with:
          script: |
            const feeds = [
              "https://rss.dw.com/rdf/rss-sp-all",
              "https://feeds.bbci.co.uk/mundo/rss.xml",
              "https://www.france24.com/es/rss"
            ];
            const results = [];
            const clean = (s) => s.replaceAll("<![CDATA[", "").replaceAll("]]>", "").replaceAll("&amp;", "&").replaceAll("&quot;", '"').replaceAll("&lt;", "<").replaceAll("&gt;", ">");
            const getTag = (s, tag) => {
              const start = s.indexOf("<" + tag + ">");
              if (start < 0) return "";
              const a = start + tag.length + 2;
              const end = s.indexOf("</" + tag + ">", a);
              return end < 0 ? "" : clean(s.slice(a, end).replace(/<[^>]*>/g, " ")).trim();
            };
            const isVideo = (value) => {
              try {
                const u = new URL(value);
                const h = u.hostname.toLowerCase();
                return h === "youtu.be" || h.endsWith("youtube.com") || h.endsWith("vimeo.com") || h.endsWith("dailymotion.com") || [".mp4", ".m3u8", ".webm"].some(ext => u.pathname.toLowerCase().endsWith(ext));
              } catch { return false; }
            };
            for (const feed of feeds) {
              const host = new URL(feed).hostname;
              try {
                const response = await fetch(feed, { signal: AbortSignal.timeout(12000) });
                if (!response.ok) throw new Error("HTTP " + response.status);
                const xml = await response.text();
                const entries = xml.split("<item>").slice(1).map(s => s.split("</item>")[0]);
                const candidates = [];
                for (const entry of entries) {
                  const title = getTag(entry, "title") || "(sin título)";
                  const description = getTag(entry, "description") + " " + getTag(entry, "summary");
                  const urls = entry.split(/\s+/).filter(s => s.startsWith("https://")).map(s => s.replace(/[<>"']+$/g, ""));
                  for (const url of urls) if (isVideo(url)) candidates.push({ title, url });
                  if ((title + " " + description).toLowerCase().includes("vídeo") || (title + " " + description).toLowerCase().includes("video")) {
                    core.info("Posible noticia con vídeo, revisar manualmente: " + title);
                  }
                }
                const unique = [...new Map(candidates.map(x => [x.url, x])).values()];
                results.push({ host, ok: true, count: entries.length, videos: unique.length });
                core.info("OK " + host + ": " + entries.length + " RSS items; " + unique.length + " posibles enlaces de vídeo.");
                for (const item of unique.slice(0, 5)) core.info("Candidato no verificado: " + item.title + " — " + item.url);
              } catch (e) {
                results.push({ host, ok: false, count: 0, videos: 0 });
                core.warning("Falló " + host + ": " + e.message);
              }
            }
            const healthy = results.filter(x => x.ok).length;
            core.summary.addHeading("Mundo al Día — prueba segura de vídeos");
            core.summary.addRaw("No se publica nada y no se llama a Railway, Facebook ni Instagram. Los candidatos requieren verificación de contenido y derechos.\n\n");
            core.summary.addTable([
              [{data:"Fuente",header:true},{data:"Estado",header:true},{data:"Elementos RSS",header:true},{data:"Candidatos de vídeo",header:true}],
              ...results.map(x => [x.host, x.ok ? "OK" : "ERROR", String(x.count), String(x.videos)])
            ]);
            await core.summary.write();
            if (healthy === 0) core.setFailed("Ninguna fuente respondió correctamente.");
            else core.info("Prueba terminada. No se publicó ningún contenido.");
