name: Video news workflow — DRY RUN (no publicar)

on:
  push:
    paths:
      - ".github/workflows/video-news-dry-run.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Leer RSS, inspeccionar artículos y preparar informe seguro
        uses: actions/github-script@v7
        with:
          script: |
            const feeds = [
              { name: "DW Español", url: "https://rss.dw.com/rdf/rss-sp-all" },
              { name: "BBC Mundo", url: "https://feeds.bbci.co.uk/mundo/rss.xml" },
              { name: "France 24 Español", url: "https://www.france24.com/es/rss" }
            ];
            const headers = { "user-agent": "MundoAlDia-DryRun/1.0 (news verification test)", "accept": "application/rss+xml, application/atom+xml, application/xml, text/xml, text/html;q=0.9, */*;q=0.8" };
            const decode = s => s.replace(/<!\[CDATA\[|\]\]>/g, "").replace(/&amp;/g, "&").replace(/&quot;/g, '"').replace(/&#39;|&apos;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(Number(n)));
            const textOf = s => decode(s.replace(/<script\b[\s\S]*?<\/script>/gi, " ").replace(/<style\b[\s\S]*?<\/style>/gi, " ").replace(/<[^>]+>/g, " ")).replace(/\s+/g, " ").trim();
            const tag = (s, name) => {
              const safe = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const re = new RegExp("<(?:[\\w.-]+:)?" + safe + "\\b[^>]*>([\\s\\S]*?)<\\/(?:[\\w.-]+:)?" + safe + "\\s*>", "i");
              const m = s.match(re);
              return m ? textOf(m[1]) : "";
            };
            const attr = (s, name) => {
              const safe = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const re = new RegExp("\\b" + safe + "\\s*=\\s*(['\"])(.*?)\\1", "i");
              const m = s.match(re);
              return m ? decode(m[2]) : "";
            };
            const absolute = (raw, base) => { try { return new URL(raw, base).href; } catch { return ""; } };
            const videoUrl = raw => {
              try {
                const u = new URL(raw);
                const host = u.hostname.toLowerCase();
                return host === "youtu.be" || host.endsWith("youtube.com") || host.endsWith("vimeo.com") || host.endsWith("dailymotion.com") || /\.(mp4|m3u8|webm|mov)(?:$)/i.test(u.pathname);
              } catch { return false; }
            };
            const cleanTitle = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(w => w.length > 3 && !["para","como","desde","sobre","entre","tras","esta","este","unas","unos","the","with","from","that","this","have","will"].includes(w));
            const similar = (a,b) => {
              const aa = new Set(cleanTitle(a)), bb = new Set(cleanTitle(b));
              if (!aa.size || !bb.size) return false;
              const common = [...aa].filter(w => bb.has(w)).length;
              return common >= 3 && common / Math.min(aa.size, bb.size) >= 0.45;
            };
            const fetchText = async (url, ms = 9000) => {
              const res = await fetch(url, { headers, signal: AbortSignal.timeout(ms), redirect: "follow" });
              if (!res.ok) throw new Error("HTTP " + res.status);
              return await res.text();
            };
            const allStories = [];
            const sourceResults = [];
            for (const feed of feeds) {
              try {
                const xml = await fetchText(feed.url, 12000);
                const blocks = [...xml.matchAll(/<(?:[\w.-]+:)?(?:item|entry)\b[^>]*>[\s\S]*?<\/(?:[\w.-]+:)?(?:item|entry)\s*>/gi)].map(m => m[0]);
                const stories = [];
                for (const block of blocks.slice(0, 18)) {
                  const title = tag(block, "title") || "(sin título)";
                  let link = tag(block, "link");
                  if (!link) {
                    const linkTag = block.match(/<(?:[\w.-]+:)?link\b[^>]*>/i);
                    if (linkTag) link = attr(linkTag[0], "href");
                  }
                  link = absolute(link, feed.url);
                  const published = tag(block, "pubDate") || tag(block, "published") || tag(block, "updated") || tag(block, "date");
                  const dateMs = published ? Date.parse(published) : NaN;
                  const videoCandidates = [];
                  for (const m of block.matchAll(/<(?:[\w.-]+:)?(?:content|player|enclosure)\b[^>]*>/gi)) {
                    const el = m[0];
                    const u = attr(el, "url") || attr(el, "href");
                    const type = attr(el, "type") + " " + attr(el, "medium");
                    const abs = absolute(u, feed.url);
                    if (abs && (videoUrl(abs) || /video/i.test(type))) videoCandidates.push(abs);
                  }
                  for (const m of block.matchAll(/https?:[^\s"'<>]+/gi)) {
                    const u = absolute(m[0].replace(/&amp;.*$/i, ""), feed.url);
                    if (u && videoUrl(u)) videoCandidates.push(u);
                  }
                  const uniqueVideos = [...new Set(videoCandidates)];
                  const story = { source: feed.name, title, url: link, published, dateMs, videos: uniqueVideos, articleVideo: false, pageChecked: false, pageStatus: "no revisada" };
                  if (link && /^https?:/i.test(link) && stories.length < 5) {
                    try {
                      const html = await fetchText(link, 7000);
                      story.pageChecked = true;
                      story.pageStatus = "página abierta";
                      const pageUrls = [];
                      for (const m of html.matchAll(/(?:href|src|content|data-src)\s*=\s*(['"])(.*?)\1/gi)) {
                        const u = absolute(decode(m[2]), link);
                        if (u && videoUrl(u)) pageUrls.push(u);
                      }
                      for (const m of html.matchAll(/https?:[^\s"'<>\\]+/gi)) {
                        const u = absolute(m[0].replace(/&amp;/g, "&"), link);
                        if (u && videoUrl(u)) pageUrls.push(u);
                      }
                      story.videos = [...new Set([...story.videos, ...pageUrls])].slice(0, 8);
                      story.articleVideo = story.videos.length > 0;
                      if (!story.articleVideo && /\b(video|vídeo|watch|player|youtube|vimeo)\b/i.test(html)) story.pageStatus = "página con señal de vídeo, enlace no confirmado";
                    } catch (e) {
                      story.pageStatus = "no se pudo abrir: " + e.message;
                    }
                  }
                  stories.push(story);
                  allStories.push(story);
                }
                sourceResults.push({ name: feed.name, url: feed.url, ok: true, count: blocks.length, inspected: stories.length, videoLinks: stories.filter(s => s.articleVideo).length });
                core.info("OK " + feed.name + ": " + blocks.length + " entradas RSS/Atom; " + stories.filter(s => s.articleVideo).length + " artículos con posible enlace de vídeo tras inspección.");
              } catch (e) {
                sourceResults.push({ name: feed.name, url: feed.url, ok: false, count: 0, inspected: 0, videoLinks: 0, error: e.message });
                core.warning("Falló " + feed.name + ": " + e.message);
              }
            }
            const now = Date.now();
            const recent = s => Number.isFinite(s.dateMs) && s.dateMs <= now + 6 * 3600000 && s.dateMs >= now - 72 * 3600000;
            const candidates = [];
            for (const story of allStories) {
              if (!story.articleVideo || !story.url || !recent(story)) continue;
              const corroborating = allStories.filter(other => other.source !== story.source && recent(other) && similar(story.title, other.title));
              candidates.push({ ...story, corroboratedBy: [...new Set(corroborating.map(s => s.source))] });
            }
            const verified = candidates.filter(s => s.corroboratedBy.length > 0);
            const needsReview = candidates.filter(s => s.corroboratedBy.length === 0);
            core.summary.addHeading("Mundo al Día — informe de prueba de vídeos");
            core.summary.addRaw("MODO SEGURO: este workflow no publica, no llama a Railway, Facebook ni Instagram y no descarga ni reutiliza los vídeos. La presencia de un enlace no confirma por sí sola la veracidad ni concede derechos de reutilización. La corroboración automática por títulos es preliminar y requiere revisión editorial humana.\n\n");
            core.summary.addHeading("Estado de fuentes", 2);
            core.summary.addTable([
              [{data:"Fuente",header:true},{data:"Estado",header:true},{data:"Entradas RSS/Atom",header:true},{data:"Artículos inspeccionados",header:true},{data:"Con posible vídeo",header:true}],
              ...sourceResults.map(s => [s.name, s.ok ? "OK" : "ERROR", String(s.count), String(s.inspected), String(s.videoLinks)])
            ]);
            core.summary.addHeading("Candidatos corroborados preliminarmente (no aprobados para publicar)", 2);
            if (verified.length) {
              core.summary.addTable([
                [{data:"Titular",header:true},{data:"Fuente",header:true},{data:"Otra fuente similar",header:true},{data:"Fecha RSS",header:true},{data:"Página",header:true},{data:"Enlace de vídeo detectado",header:true}],
                ...verified.slice(0, 15).map(s => [s.title, s.source, s.corroboratedBy.join(", "), s.published || "fecha ausente", s.url, s.videos[0] || "no disponible"])
              ]);
            } else core.summary.addRaw("No se encontraron candidatos que cumplieran todos los filtros automáticos.\n\n");
            core.summary.addHeading("Candidatos que necesitan revisión adicional", 2);
            if (needsReview.length) {
              core.summary.addTable([
                [{data:"Titular",header:true},{data:"Fuente",header:true},{data:"Fecha RSS",header:true},{data:"Motivo",header:true},{data:"Artículo",header:true}],
                ...needsReview.slice(0, 15).map(s => [s.title, s.source, s.published || "fecha ausente", "Enlace detectado, pero sin coincidencia independiente por titular", s.url])
              ]);
            } else core.summary.addRaw("Ninguno.\n\n");
            const pageErrors = allStories.filter(s => s.url && !s.pageChecked).length;
            core.summary.addRaw("\nLímite de la prueba: se inspeccionan como máximo 5 páginas por fuente. La coincidencia entre titulares no sustituye la verificación de hechos; las fechas ausentes o dudosas se excluyen de los candidatos automáticos. Páginas no abiertas: " + pageErrors + ".\n");
            await core.summary.write();
            core.info("Prueba terminada. " + allStories.length + " entradas analizadas; " + candidates.length + " candidatas con vídeo y fecha reciente; " + verified.length + " con corroboración preliminar. No se publicó ningún contenido.");
            if (sourceResults.every(s => !s.ok)) core.setFailed("Ninguna fuente respondió correctamente.");
