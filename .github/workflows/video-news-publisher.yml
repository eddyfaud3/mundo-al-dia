name: Video news — verificación final y publicación controlada

on:
  push:
    branches:
      - "test/video-news-publisher"
    paths:
      - ".github/workflows/video-news-publisher.yml"
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Publicar un video ahora (solo en main y tras superar todas las verificaciones)"
        required: false
        default: false
        type: boolean
  # Dos ciclos al día, uno por video. Se activa en main después de revisar esta prueba.
  schedule:
    - cron: "17 0,15 * * *"

permissions:
  contents: read

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verificar fuente, fecha, título, video, canal e imagen
        uses: actions/github-script@v7
        env:
          AUTOMATION_SECRET: ${{ secrets.MUNDO_AL_DIA_AUTOMATION_SECRET }}
          SITE_URL: https://mundo-al-dia-github-production.up.railway.app
        with:
          script: |
            const feeds = [
              {name:"DW Español",url:"https://rss.dw.com/rdf/rss-sp-all",aliases:["dw"]},
              {name:"BBC Mundo",url:"https://feeds.bbci.co.uk/mundo/rss.xml",aliases:["bbc"]},
              {name:"France 24 Español",url:"https://www.france24.com/es/rss",aliases:["france 24"]}
            ];
            const headers = {"user-agent":"MundoAlDia-VideoPublisher/1.0","accept":"application/rss+xml, application/atom+xml, application/xml, text/xml, text/html;q=0.9, */*;q=0.8"};
            const isMain = context.ref === "refs/heads/main";
            const manualApproval = context.eventName === "workflow_dispatch" && context.payload?.inputs?.publish_now === "true";
            const publishAllowed = isMain && (context.eventName === "schedule" || manualApproval);
            const decode = s => String(s||"").replace(/<!\[CDATA\[|\]\]>/g,"").replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(Number(n))).replace(/&#x([0-9a-f]+);/gi,(_,n)=>String.fromCodePoint(parseInt(n,16)));
            const textOf = s => decode(String(s||"").replace(/<script\b[\s\S]*?<\/script>/gi," ").replace(/<style\b[\s\S]*?<\/style>/gi," ").replace(/<[^>]+>/g," ")).replace(/\s+/g," ").trim();
            const attr = (s,n) => { const m=String(s||"").match(new RegExp("\\b"+n+"\\s*=\\s*(['\"])(.*?)\\1","i")); return m?decode(m[2]):""; };
            const abs = (raw,base) => {try{return new URL(raw,base).href}catch{return ""}};
            const tokens = s => textOf(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>=4&&!["para","como","desde","sobre","entre","tras","esta","este","unos","unas","donde","cuando","porque","tambien","segun","despues","durante","hasta","contra","ante","video","mundo","france","noticia","ultima","hora"].includes(w));
            const overlap = (a,b) => {const aa=new Set(tokens(a)),bb=new Set(tokens(b));const n=[...aa].filter(w=>bb.has(w)).length;return {n,ratio:n/Math.max(1,Math.min(aa.size,bb.size))};};
            const recent = d => Number.isFinite(d) && d <= Date.now()+3*3600000 && d >= Date.now()-72*3600000;
            const videoId = raw => {try{const u=new URL(raw),h=u.hostname.toLowerCase();if(h==="youtu.be")return u.pathname.split("/").filter(Boolean)[0]||"";if(h.includes("youtube.com"))return u.searchParams.get("v")||u.pathname.match(/^\/(?:shorts|embed|live)\/([^/?]+)/i)?.[1]||"";return ""}catch{return ""}};
            const specificVideo = raw => {try{const u=new URL(raw),h=u.hostname.toLowerCase();if(h==="youtu.be")return /^\/[A-Za-z0-9_-]{6,}$/.test(u.pathname);if(h==="youtube.com"||h.endsWith(".youtube.com"))return u.pathname==="/watch"?/^[A-Za-z0-9_-]{6,}$/.test(u.searchParams.get("v")||""):/^\/(?:shorts|embed|live)\/[A-Za-z0-9_-]{6,}/i.test(u.pathname);if(h==="vimeo.com"||h.endsWith(".vimeo.com"))return /^\/(?:video\/)?\d{6,}(?:\/|$)/.test(u.pathname);return /\.(mp4|m3u8|webm|mov)(?:$|\?)/i.test(u.href)}catch{return false}};
            const fetchText = async (url,ms=9000) => {const r=await fetch(url,{headers,redirect:"follow",signal:AbortSignal.timeout(ms)});if(!r.ok)throw Error("HTTP "+r.status);return r.text()};
            const stories=[];
            const sourceStatus=[];
            for(const feed of feeds){
              try{
                const xml=await fetchText(feed.url,12000);
                const blocks=[...xml.matchAll(/<(?:item|entry)\b[^>]*>[\s\S]*?<\/(?:item|entry)\s*>/gi)].map(m=>m[0]);
                sourceStatus.push(feed.name+": RSS OK ("+blocks.length+")");
                for(const block of blocks.slice(0,8)){
                  const titleMatch=block.match(/<title\b[^>]*>([\s\S]*?)<\/title>/i);
                  const title=textOf(titleMatch?.[1]||"");
                  const rawLink=(block.match(/<link\b[^>]*href=["']([^"']+)["'][^>]*\/?\s*>/i)||[])[1]||textOf((block.match(/<link\b[^>]*>([\s\S]*?)<\/link>/i)||[])[1]||"");
                  const url=abs(rawLink,feed.url);
                  const dateText=textOf((block.match(/<(?:pubDate|published|updated|dc:date)\b[^>]*>([\s\S]*?)<\/(?:pubDate|published|updated|dc:date)>/i)||[])[1]||"");
                  const dateMs=dateText?Date.parse(dateText):NaN;
                  if(title.length<18||!url.startsWith("https://")||!recent(dateMs))continue;
                  stories.push({source:feed.name,aliases:feed.aliases,title,url,dateText,dateMs});
                }
              }catch(e){sourceStatus.push(feed.name+": ERROR "+e.message);core.warning(feed.name+" RSS: "+e.message)}
            }
            if(!sourceStatus.some(s=>s.includes("RSS OK"))) {core.setFailed("Ninguna fuente RSS respondió.");return;}
            const candidates=[];
            for(const story of stories){
              try{
                const page=await fetch(story.url,{headers,redirect:"follow",signal:AbortSignal.timeout(7000)});
                const html=await page.text();
                const finalUrl=page.url||story.url;
                if(!page.ok||!/html|xml/i.test(page.headers.get("content-type")||""))continue;
                const titleTag=html.match(/<title\b[^>]*>([\s\S]*?)<\/title>/i);
                const pageTitle=textOf(titleTag?.[1]||"");
                if(overlap(story.title,pageTitle).n<2)continue;
                const meta = wanted => {for(const m of html.matchAll(/<meta\b[^>]*>/gi)){const el=m[0],key=(attr(el,"property")||attr(el,"name")||"").toLowerCase();if(wanted.includes(key)){const v=attr(el,"content");if(v)return v}}return ""};
                const description=meta(["og:description","description","twitter:description"])||story.title;
                const imageUrl=abs(meta(["og:image","og:image:url","twitter:image","twitter:image:src"]),finalUrl);
                if(!imageUrl||!imageUrl.startsWith("https://")||/google\.com|gstatic\.com|googleusercontent\.com|news\.google\.com/i.test(new URL(imageUrl).hostname))continue;
                let imageEvidence=meta(["og:image:alt","twitter:image:alt","image:alt"]);
                if(!imageEvidence){
                  for(const m of html.matchAll(/<img\b[^>]*>/gi)){
                    const el=m[0],raw=attr(el,"src")||attr(el,"data-src")||attr(el,"data-lazy-src");
                    if(raw&&abs(raw,finalUrl)===imageUrl&&attr(el,"alt")){imageEvidence=attr(el,"alt");break}
                  }
                }
                if(!imageEvidence){
                  const filename=decodeURIComponent(new URL(imageUrl).pathname.split("/").pop()||"").replace(/\.[a-z0-9]{2,5}$/i,"").replace(/[-_]/g," ");
                  imageEvidence=filename;
                }
                const imageMatch=overlap(story.title,imageEvidence);
                if(imageMatch.n<1){
                  core.info("IMAGEN BLOQUEADA: no se encontró evidencia textual suficiente de que la foto corresponda al titular | "+story.title+" | alt/archivo: "+imageEvidence);
                  continue;
                }
                const videoUrls=[];
                for(const m of html.matchAll(/<(?:iframe|video|source|embed)\b[^>]*>/gi)){const el=m[0];const raw=attr(el,"src")||attr(el,"data-src")||attr(el,"data-video-url")||attr(el,"data-embed-url");const u=abs(raw,finalUrl);if(u&&specificVideo(u))videoUrls.push(u)}
                for(const m of html.matchAll(/<meta\b[^>]*>/gi)){const el=m[0],key=(attr(el,"property")+" "+attr(el,"name")+" "+attr(el,"itemprop")).toLowerCase();if(/video|embedurl|content_url/.test(key)){const u=abs(attr(el,"content"),finalUrl);if(u&&specificVideo(u))videoUrls.push(u)}}
                for(const m of html.matchAll(/<a\b[^>]*>/gi)){const u=abs(attr(m[0],"href"),finalUrl);if(u&&specificVideo(u))videoUrls.push(u)}
                for(const m of html.matchAll(/<script\b[^>]*type\s*=\s*(['"])application\/ld\+json\1[^>]*>([\s\S]*?)<\/script>/gi)){
                  try{
                    const data=JSON.parse(decode(m[2]));
                    const visit=obj=>{
                      if(!obj||typeof obj!=="object")return;
                      const types=Array.isArray(obj["@type"])?obj["@type"]:[obj["@type"]];
                      if(types.some(t=>String(t||"").toLowerCase()==="videoobject")){
                        for(const key of ["contentUrl","embedUrl","url"]){const u=abs(obj[key],finalUrl);if(u&&specificVideo(u))videoUrls.push(u)}
                      }
                      for(const value of Object.values(obj))if(value&&typeof value==="object")Array.isArray(value)?value.forEach(visit):visit(value);
                    };
                    visit(data);
                  }catch{}
                }
                const uniqueVideos=[...new Set(videoUrls)].slice(0,8);
                if(!uniqueVideos.length)continue;
                const paragraphs=[...html.matchAll(/<p\b[^>]*>([\s\S]*?)<\/p>/gi)].map(m=>textOf(m[1])).filter(p=>p.length>=60&&!/(cookies|suscr[ií]bete|aceptar todas|publicidad|síguenos en redes)/i.test(p)).slice(0,10);
                for(const video of uniqueVideos){
                  const id=videoId(video);
                  if(!id)continue;
                  try{
                    const o=await fetch("https://www.youtube.com/oembed?format=json&url="+encodeURIComponent("https://www.youtube.com/watch?v="+id),{headers,signal:AbortSignal.timeout(6000)});
                    if(!o.ok)continue;
                    const metaVideo=await o.json();
                    const t=overlap(story.title,metaVideo.title||"");
                    const channel=String(metaVideo.author_name||"").toLowerCase();
                    const channelOk=story.aliases.some(a=>channel.includes(a));
                    if(t.n<2||t.ratio<0.30||!channelOk)continue;
                    candidates.push({...story,pageTitle,description,imageUrl,imageEvidence,videoUrl:"https://www.youtube.com/watch?v="+id,videoTitle:metaVideo.title,channel,articleText:paragraphs.join("\n\n").slice(0,7000),verifiedAt:Date.now()});
                  }catch{}
                }
              }catch(e){core.info("Candidato omitido por error de verificación: "+story.title+" — "+e.message)}
            }
            const unique=[];
            for(const c of candidates.sort((a,b)=>b.dateMs-a.dateMs)){
              if(unique.some(p=>p.videoUrl===c.videoUrl||overlap(p.title,c.title).n>=3))continue;
              unique.push(c);
            }
            const selected=unique.slice(0,2);
            core.info("RESUMEN DE VERIFICACIÓN | páginas RSS recientes: "+stories.length+" | candidatos con metadatos finales válidos: "+candidates.length+" | después de deduplicar: "+unique.length+" | seleccionados para informe: "+selected.length);
            for(const s of selected)core.info("CANDIDATO VERIFICADO | "+s.source+" | "+s.title+" | video: "+s.videoUrl+" | canal: "+s.channel+" | imagen: "+s.imageUrl+" | evidencia de imagen: "+s.imageEvidence);
            core.summary.addHeading("Mundo al Día — verificación final de videos");
            core.summary.addRaw((publishAllowed?"PUBLICACIÓN CONTROLADA: máximo un artículo por ciclo programado. ":"MODO INFORME: esta ejecución no publica. ")+"Se requiere fuente editorial aprobada, fecha de las últimas 72 horas, título coherente, URL de video concreta, metadatos de YouTube cuyo título coincida y canal oficial, imagen HTTPS del artículo original y evidencia textual de que la imagen corresponde al titular. Los videos se incrustan mediante el enlace oficial; no se descargan ni se vuelven a subir. Los derechos de las imágenes y la exactitud del hecho no quedan certificados automáticamente.\n\n");
            core.summary.addRaw(sourceStatus.join("\n")+"\n\n");
            if(!selected.length){core.summary.addRaw("No hay candidatos que superen todos los filtros; no se publicará nada.\n");}
            else core.summary.addTable([
              [{data:"Prioridad",header:true},{data:"Titular",header:true},{data:"Fuente",header:true},{data:"Video verificado",header:true},{data:"Canal",header:true},{data:"Imagen",header:true}],
              ...selected.map((s,i)=>[String(i+1),s.title,s.source,s.videoTitle,s.channel,s.imageUrl])
            ]);
            await core.summary.write();
            if(!publishAllowed){core.info("MODO INFORME: no se envía nada a Railway ni a redes sociales.");return;}
            if(!process.env.AUTOMATION_SECRET){core.setFailed("Falta MUNDO_AL_DIA_AUTOMATION_SECRET; no se publicó nada.");return;}
            let published=false,lastError="";
            const slugify=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,150).replace(/-+$/g,"");
            for(const s of selected){
              const slug=slugify(s.title);
              const content=[s.title,"",s.articleText||s.description,"","Video oficial: "+s.videoUrl,"","Fuente original: "+s.url,"Medio: "+s.source,"","El video se muestra mediante el enlace oficial del medio; no se descargó ni se volvió a subir."].join("\n").slice(0,28000);
              try{
                const res=await fetch(new URL("/api/automation/publish",process.env.SITE_URL),{
                  method:"POST",headers:{"Authorization":"Bearer "+process.env.AUTOMATION_SECRET,"Content-Type":"application/json"},
                  body:JSON.stringify({title:s.title.slice(0,220),slug,excerpt:String(s.description||s.title).slice(0,700),content,category:"Internacional",image_url:s.imageUrl,video_url:s.videoUrl}),
                  signal:AbortSignal.timeout(15000)
                });
                const result=await res.json().catch(()=>({}));
                if(res.status===409){core.info("Noticia duplicada; se prueba el siguiente candidato.");continue}
                if(!res.ok){lastError=result.error||"HTTP "+res.status;core.warning("No se publicó "+s.title+": "+lastError);continue}
                core.info("PUBLICACIÓN CONFIRMADA: "+s.title+" — "+result.url);
                core.info(result.facebook?.published?"Facebook confirmó la publicación.":"Facebook no confirmó: "+(result.facebook?.reason||"sin detalles"));
                core.info(result.instagram?.published?"Instagram confirmó la publicación.":"Instagram no confirmó: "+(result.instagram?.reason||"sin detalles"));
                published=true;break;
              }catch(e){lastError=e.message||"error de red";core.warning("Error al publicar: "+lastError)}
            }
            if(!published)core.info("No se publicó ningún candidato en este ciclo. "+lastError);
